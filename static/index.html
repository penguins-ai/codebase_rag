<!DOCTYPE html>
<html>
<head>
  <title>MQSim RAG</title>
  <style>
    body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 80px; font-size: 14px; }
    button { margin-top: 8px; padding: 8px 20px; cursor: pointer; }
    #answer { white-space: pre-wrap; background: #f4f4f4; padding: 16px; margin-top: 16px; border-radius: 4px; }
    #sources { margin-top: 12px; font-size: 13px; color: #555; }
    .source { margin: 4px 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
</head>
<body>
  <h2>MQSim Codebase RAG</h2>
  <textarea id="question" placeholder="Ask something about MQSim..."></textarea>
  <br>
  <button onclick="ask()">Ask</button>
  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    async function ask() {
      const question = document.getElementById("question").value;
      document.getElementById("answer").innerText = "Thinking...";
      document.getElementById("sources").innerHTML = "";

      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, top_k: 6 })
      });

      const data = await res.json();
      document.getElementById("answer").innerHTML = marked.parse(data.answer)
      document.getElementById("sources").innerHTML = "<b>Sources:</b><br>" +
        data.sources.map(s =>
          `<div class="source">📄 ${s.file}:${s.line} — <b>${s.name}</b> (score: ${s.score})</div>`
        ).join("");
    }
  </script>
</body>
</html>
